}).sort((a,b)=>{if(a.year===null&&b.year!==null)return 1;if(b.year===null&&a.year!==null)return -1;return (a.year||0)-(b.year||0)||a.brand.localeCompare(b.brand)||a.model.localeCompare(b.model);});}
function state(){return Object.fromEntries(ids.map(k=>[k,$(k).value]));}
for(const k of ['brand','year','productType'])for(const v of [...new Set(rows.map(r=>r[k]).filter(v=>v!==null))].sort())$(k).insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`);
for(const id of ids){const select=$(id),chips=document.createElement('div');chips.className='chips';chips.id='chips-'+id;select.insertAdjacentElement('afterend',chips);}
function renderChips(){for(const id of ids){const select=$(id),host=$('chips-'+id);host.innerHTML=[...select.options].map(o=>`<button class="chip ${select.value===o.value?'active':''}" data-filter="${id}" data-value="${esc(o.value)}">${esc(o.textContent)}</button>`).join('');}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{$(b.dataset.filter).value=b.dataset.value;render();});}
const label={yes:'已确认',no:'无',conditional:'有条件／部分待核',unknown:'待核实'};
function editor(r,k,value,extra=''){return `<span class="static ${extra}">${esc(value??'')}</span>`;}
function cell(r,k){const status=r[k+'Status'];return `${status?`<span class="badge ${status}">${label[status]}</span>`:''}${editor(r,k,r[k],'value')}`;}
function sourceCell(r){const url=r.sources[0]||'';return `<div class="static links"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a></div>`;}
function timeCell(r){const m=String(r.dateNote||'').match(/^(\d{4}(?:-\d{2})?)(?:；(.*))?$/);const label=m?m[1]:(r.year===null?'':String(r.year));return editor(r,'dateNote',label);}
function statusFor(v){return v.startsWith('/')?'no':v.startsWith('待核实')?'unknown':/待核实|待.*确认|待.*核对|未核实|未确认|未获.*确认|冲突|需|依|条件/.test(v)?'conditional':'yes';}
function render(){const a=selectRows(state());$('count').textContent=`当前 ${a.length} / ${rows.length} 条`;
 renderChips();
 renderMatrix(a);
 const table=$('table');
 if(!a.length){table.querySelector('thead').innerHTML='';table.querySelector('tbody').innerHTML='<tr><td class="empty">没有符合条件的条目。可重置筛选后重试。</td></tr>';return;}
 table.querySelector('thead').innerHTML='<tr><th scope="col">产品</th><th scope="col">时间</th><th scope="col">产品类型</th><th scope="col">容量／最大扩容</th><th scope="col">堆叠／扩展方式</th><th scope="col">并网输出</th><th scope="col">持续离网输出</th><th scope="col">AC输入</th><th scope="col">市电旁路／自动切换</th><th scope="col">产品官方链接</th></tr>';
 table.querySelector('tbody').innerHTML=a.map(r=>`<tr><th scope="row">${editor(r,'model',r.model)}<small>${editor(r,'brand',r.brand)} · ${editor(r,'kind',r.kind)}</small></th><td>${timeCell(r)}</td><td><b>${editor(r,'productType',r.productType)}</b><small>${editor(r,'typeNote',r.typeNote)}</small></td><td>${editor(r,'capacity',r.capacity)}</td><td>${editor(r,'stack',r.stack)}</td><td>${editor(r,'grid',r.grid)}</td><td>${cell(r,'off')}</td><td>${cell(r,'ac')}</td><td>${cell(r,'bypass')}</td><td>${sourceCell(r)}</td></tr>`).join('');
}
ids.forEach(k=>$(k).addEventListener('input',render));
$('reset').onclick=()=>{ids.forEach(k=>$(k).value='');render();};
function csvFor(a){const keys=['year','dateNote','brand','model','productType','kind',...fields,'sources'];const header=['归档年','时间','品牌','型号','产品类型','范围','容量','扩容方式','并网输出','离网输出','AC输入','旁路自动切换','产品官方链接'];return '\ufeff'+[header,...a.map(r=>keys.map(k=>Array.isArray(r[k])?(r[k][0]||''):r[k]??''))].map(v=>v.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');}
$('export').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([csvFor(selectRows(state()))],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='欧洲阳台储能-可编辑版.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('editMatrix').onclick=()=>{matrixEdit=!matrixEdit;$('editMatrix').textContent=matrixEdit?'完成布局':'编辑布局';$('matrixEditHint').textContent=matrixEdit?'可拖动产品点与标签':'布局锁定';$('matrix').style.cursor=matrixEdit?'move':'default';};
$('resetMatrix').onclick=()=>{localStorage.removeItem(matrixLayoutKey);render();};
const toBase64=v=>btoa(unescape(encodeURIComponent(v)));
async function saveLayoutToGithub(layout){let token=localStorage.getItem(githubTokenKey);if(!token){token=prompt('首次自动同步：粘贴仅限该仓库 Contents 写入权限的 GitHub Token');if(!token){$('matrixEditHint').textContent='未配置云端同步授权';return;}localStorage.setItem(githubTokenKey,token.trim());}try{const url=`https://api.github.com/repos/${githubRepo}/contents/${githubLayoutPath}`;const h={Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json'};const old=await fetch(url,{headers:h}).then(r=>r.ok?r.json():null);const body={message:'Update matrix layout',content:toBase64(JSON.stringify(layout,null,2)),branch:'main'};if(old?.sha)body.sha=old.sha;const res=await fetch(url,{method:'PUT',headers:{...h,'Content-Type':'application/json'},body:JSON.stringify(body)});$('matrixEditHint').textContent=res.ok?'已自动同步到云端':'云端同步失败';}catch{$('matrixEditHint').textContent='云端同步失败';}}
async function loadLayoutFromGithub(){try{const r=await fetch(`https://raw.githubusercontent.com/${githubRepo}/main/${githubLayoutPath}`);if(r.ok){remoteMatrixLayout=await r.json();render();}}catch{}}
render();
loadLayoutFromGithub();
</script></body></html>
